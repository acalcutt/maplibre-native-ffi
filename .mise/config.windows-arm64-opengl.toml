[env]
MLN_FFI_VARIANT = "windows-arm64-opengl"
MLN_FFI_TARGET_TRIPLE = "windows-arm64"
MLN_FFI_RENDER_BACKEND = "opengl"
MLN_FFI_BUILD_DIR = "{{config_root}}/build/windows-arm64-opengl"
MLN_FFI_CMAKE_GENERATOR = "Ninja"
MLN_FFI_CMAKE_GENERATOR_PLATFORM = ""
MLN_FFI_CMAKE_BUILD_CONFIG = ""
MLN_FFI_ENABLE_CLANG_TIDY = "OFF"
CC = "cl.exe"
CXX = "cl.exe"
DYLD_LIBRARY_PATH = "{{config_root}}/build/windows-arm64-opengl"
LD_LIBRARY_PATH = "{{config_root}}/build/windows-arm64-opengl"
