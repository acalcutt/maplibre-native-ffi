name: CI

on:
  push:
    branches: [main, ci-test/windows-x64-opengl]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-ci-deps
      - run: mise run ci:lint common

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-ci-deps
      - run: mise run //docs:build

  prepare-matrices:
    name: prepare matrices
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      native: ${{ steps.matrix.outputs.native }}
      examples: ${{ steps.matrix.outputs.examples }}
      bindings: ${{ steps.matrix.outputs.bindings }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-ci-deps
      - id: matrix
        run: |
          {
            echo "native=$(mise run -q ci:matrix native)"
            echo "examples=$(mise run -q ci:matrix examples)"
            echo "bindings=$(mise run -q ci:matrix bindings)"
          } >> "$GITHUB_OUTPUT"

  native:
    name: native / ${{ matrix.variant }}
    runs-on: ${{ matrix.runner }}
    needs: prepare-matrices
    timeout-minutes: 60
    env:
      MISE_ENV: ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrices.outputs.native) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Cache MapLibre Native source
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            third_party/maplibre-native
            .git/modules/third_party/maplibre-native
          key: mln-src-v2-${{ hashFiles('.gitmodules', 'cmake/mln_version.cmake') }}
      - uses: ./.github/actions/setup-ci-deps
      - name: Enable Git long paths (Windows only)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        # maplibre-native contains deeply nested paths that exceed Windows'
        # default MAX_PATH (260 chars). Without this, git submodule update
        # silently fails to check out some files, leaving the submodule dirty
        # and causing ci:lint's git diff check to fail.
        run: git config --global core.longpaths true
      - name: Install EGL/GLES2 dev libraries (Linux OpenGL only)
        if: ${{ contains(matrix.variant, 'opengl') && runner.os == 'Linux' }}
        # libgles2-mesa-dev is intentionally omitted: it pulls in libpng-dev
        # which conflicts with pixi's libpng.so headers at configure time.
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends libegl-dev libgles-dev libgles2 libegl-mesa0 libegl1 libgl1-mesa-dri
      - name: Set up MSVC (Windows only)
        if: ${{ runner.os == 'Windows' }}
        # pixi's cxx-compiler package was removed to avoid its vs2022_compiler_vars.bat
        # activation exceeding CMD.exe's 8191-char PATH limit on GitHub runners.
        # ilammy/msvc-dev-cmd runs vcvarsall.bat once and exports MSVC env vars
        # into the GitHub Actions environment, sidestepping the BAT-level PATH
        # length limit and persisting across all subsequent steps.
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Download Mesa3D (Windows x64 OpenGL)
        if: ${{ matrix.variant == 'windows-x64-opengl' }}
        shell: pwsh
        run: |
          $headers = @{ Authorization = ('Bearer {0}' -f '${{ secrets.GITHUB_TOKEN }}') }
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/pal1000/mesa-dist-win/releases/latest' -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -like 'mesa3d-*-release-msvc.7z' } | Select-Object -First 1
          Invoke-WebRequest $asset.browser_download_url -OutFile mesa3d.7z
          $buildDir = "$env:MLN_FFI_BUILD_DIR"
          New-Item -ItemType Directory -Force -Path $buildDir | Out-Null
          & 'C:\Program Files\7-Zip\7z.exe' e -o"$buildDir" .\mesa3d.7z x64\opengl32.dll x64\libgallium_wgl.dll x64\libGLESv2.dll
          Get-ChildItem "$buildDir\opengl32.dll", "$buildDir\libgallium_wgl.dll", "$buildDir\libGLESv2.dll"
      - run: mise run configure
      - run: mise run ci:lint native
      - name: Run tests (Linux OpenGL — Mesa llvmpipe surfaceless)
        if: ${{ contains(matrix.variant, 'opengl') && runner.os == 'Linux' }}
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: mise run test
      - name: Run tests (Windows OpenGL — Mesa llvmpipe)
        if: ${{ matrix.variant == 'windows-x64-opengl' }}
        shell: pwsh
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: |
          $buildDir = "$env:MLN_FFI_BUILD_DIR"
          $env:PATH = "$buildDir;$env:PATH"
          mise run test
      - name: Run tests
        if: ${{ !(contains(matrix.variant, 'opengl')) && matrix.variant != 'windows-x64-vulkan' }}
        run: mise run test
      # Windows Vulkan builds successfully but tests are runtime-broken.
      - if: ${{ matrix.variant == 'windows-x64-vulkan' }}
        run: mise run build
      - run: mise run ci:prepare-native-artifact
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.variant }}
          path: ci-artifact
          if-no-files-found: error
          retention-days: 14

  bindings:
    name: bindings / ${{ matrix.binding }} / ${{ matrix.variant }}
    runs-on: ${{ matrix.runner }}
    needs:
      - native
      - prepare-matrices
    timeout-minutes: 60
    env:
      MISE_ENV: ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrices.outputs.bindings) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-ci-deps
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-${{ matrix.variant }}
          path: .
      - name: Install EGL/GLES2 runtime libraries (Linux OpenGL only)
        if: ${{ contains(matrix.variant, 'opengl') && runner.os == 'Linux' }}
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends libgles2 libegl-mesa0 libegl1 libgl1-mesa-dri
      - name: Run binding task
        env:
          # For OpenGL on Linux: direct EGL to the surfaceless platform and
          # force Mesa llvmpipe so tests can render without a display server.
          # These are no-ops for non-OpenGL backends (empty value is ignored).
          EGL_PLATFORM: ${{ contains(matrix.variant, 'opengl') && runner.os == 'Linux' && 'surfaceless' || '' }}
          LIBGL_ALWAYS_SOFTWARE: ${{ contains(matrix.variant, 'opengl') && runner.os == 'Linux' && '1' || '' }}
          GALLIUM_DRIVER: ${{ contains(matrix.variant, 'opengl') && runner.os == 'Linux' && 'llvmpipe' || '' }}
        run: mise run "${{ matrix.task }}"

  examples:
    name: examples / ${{ matrix.example }} / ${{ matrix.variant }}
    runs-on: ${{ matrix.runner }}
    needs:
      - native
      - prepare-matrices
    timeout-minutes: 60
    env:
      MISE_ENV: ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrices.outputs.examples) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-ci-deps
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-${{ matrix.variant }}
          path: .
      - name: Install EGL/GLES2 runtime libraries (Linux OpenGL only)
        if: ${{ contains(matrix.variant, 'opengl') && runner.os == 'Linux' }}
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends libgles2 libegl-mesa0 libegl1 libgl1-mesa-dri
      - name: Run example task
        env:
          EGL_PLATFORM: ${{ contains(matrix.variant, 'opengl') && runner.os == 'Linux' && 'surfaceless' || '' }}
          LIBGL_ALWAYS_SOFTWARE: ${{ contains(matrix.variant, 'opengl') && runner.os == 'Linux' && '1' || '' }}
          GALLIUM_DRIVER: ${{ contains(matrix.variant, 'opengl') && runner.os == 'Linux' && 'llvmpipe' || '' }}
        run: mise run "${{ matrix.task }}"

  required:
    name: ci-required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - hygiene
      - docs
      - prepare-matrices
      - native
      - bindings
      - examples
    steps:
      - name: Fail if required jobs failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo '${{ toJSON(needs) }}'
          exit 1

      - run: true
