name: CI variant

on:
  workflow_call:
    inputs:
      variant:
        required: true
        type: string
      runner:
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare-matrices:
    name: prepare matrices / ${{ inputs.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      bindings: ${{ steps.matrix.outputs.bindings }}
      bindings_count: ${{ steps.matrix.outputs.bindings_count }}
      examples: ${{ steps.matrix.outputs.examples }}
      examples_count: ${{ steps.matrix.outputs.examples_count }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-ci-deps
      - id: matrix
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          bindings="$(mise run -q ci:matrix bindings --variant "$VARIANT")"
          examples="$(mise run -q ci:matrix examples --variant "$VARIANT")"
          bindings_count="$(MATRIX_JSON="$bindings" python -c 'import json, os; print(len(json.loads(os.environ["MATRIX_JSON"])["include"]))')"
          examples_count="$(MATRIX_JSON="$examples" python -c 'import json, os; print(len(json.loads(os.environ["MATRIX_JSON"])["include"]))')"
          {
            echo "bindings=$bindings"
            echo "bindings_count=$bindings_count"
            echo "examples=$examples"
            echo "examples_count=$examples_count"
          } >> "$GITHUB_OUTPUT"

  native:
    name: native / ${{ inputs.variant }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    env:
      MISE_ENV: ${{ inputs.variant }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Cache MapLibre Native source
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            third_party/maplibre-native
            .git/modules/third_party/maplibre-native
          key: mln-src-v2-${{ hashFiles('.gitmodules', 'cmake/mln_version.cmake') }}
      - uses: ./.github/actions/setup-ci-deps
      - name: Install EGL/GLES2 dev libraries (Linux OpenGL only)
        if: ${{ contains(inputs.variant, 'opengl') && runner.os == 'Linux' }}
        # libgles-dev (not libgles2-mesa-dev): avoids a hard libpng-dev
        # dependency that conflicts with pixi's managed libpng headers.
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends libegl-dev libgles-dev libgles2 libegl-mesa0 libegl1 libgl1-mesa-dri
      - name: Set up MSVC (Windows only)
        if: ${{ runner.os == 'Windows' }}
        # pixi's cxx-compiler activates vs2022_compiler_vars.bat which can exceed
        # CMD.exe's 8191-char PATH limit on GitHub runners. ilammy/msvc-dev-cmd
        # runs vcvarsall.bat once and exports MSVC env vars directly, avoiding
        # the PATH limit and persisting across all subsequent steps.
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Download Mesa3D (Windows x64 OpenGL)
        if: ${{ inputs.variant == 'windows-x64-opengl' }}
        shell: pwsh
        run: |
          $headers = @{ Authorization = ('Bearer {0}' -f '${{ secrets.GITHUB_TOKEN }}') }
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/pal1000/mesa-dist-win/releases/latest' -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -like 'mesa3d-*-release-msvc.7z' } | Select-Object -First 1
          Invoke-WebRequest $asset.browser_download_url -OutFile mesa3d.7z
          $buildDir = "$env:MLN_FFI_BUILD_DIR"
          New-Item -ItemType Directory -Force -Path $buildDir | Out-Null
          # Extract all x64 DLLs so every transitive dependency of libgallium_wgl.dll
          # (e.g. dxil.dll, libglapi.dll, sp-lossless.dll ...) is satisfied. Missing deps
          # cause blocking "DLL not found" dialogs on Windows that hang CI indefinitely.
          & 'C:\Program Files\7-Zip\7z.exe' e -o"$buildDir" .\mesa3d.7z -ir'!x64\*.dll'
          Get-ChildItem "$buildDir\libgallium_wgl.dll", "$buildDir\libGLESv2.dll"
          # Register libgallium_wgl as the OpenGL ICD so system opengl32.dll dispatches to it
          $dllPath = "$buildDir\libgallium_wgl.dll"
          reg add 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\OpenGLDrivers\MSOGL' /v DLL /t REG_SZ /d $dllPath /f
          reg add 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\OpenGLDrivers\MSOGL' /v DriverVersion /t REG_DWORD /d 1 /f
          reg add 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\OpenGLDrivers\MSOGL' /v Flags /t REG_DWORD /d 1 /f
          reg add 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\OpenGLDrivers\MSOGL' /v Version /t REG_DWORD /d 2 /f
      - run: mise run configure
      # Windows builds successfully, but native tests/examples are runtime-broken for now.
      - if: ${{ inputs.variant == 'windows-x64-vulkan' || inputs.variant == 'windows-x64-opengl' }}
        run: mise run build
      - name: Run tests (Windows OpenGL — Mesa llvmpipe)
        if: ${{ inputs.variant == 'windows-x64-opengl' }}
        timeout-minutes: 10
        shell: pwsh
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
          GALLIUM_DRIVER: llvmpipe
          ANGLE_DEFAULT_PLATFORM: gl
        run: |
          # Suppress Win32 hard-error dialogs (DLL missing popup boxes) so any
          # residual missing-dependency failures abort rather than blocking CI.
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public class Win32ErrorMode { [DllImport("kernel32.dll")] public static extern int SetErrorMode(int uMode); }'
          [Win32ErrorMode]::SetErrorMode(0x8003) | Out-Null  # SEM_FAILCRITICALERRORS|SEM_NOGPFAULTERRORBOX|SEM_NOOPENFILEERRORBOX
          $buildDir = "$env:MLN_FFI_BUILD_DIR"
          $env:PATH = "$buildDir;$env:PATH"
          mise run test
      - name: Run tests
        if: ${{ inputs.variant != 'windows-x64-vulkan' && inputs.variant != 'windows-x64-opengl' }}
        env:
          # For OpenGL on Linux: direct EGL to the surfaceless platform and
          # force Mesa llvmpipe so tests can render without a display server.
          # These are no-ops for non-OpenGL backends (empty value is ignored).
          EGL_PLATFORM: ${{ contains(inputs.variant, 'opengl') && runner.os == 'Linux' && 'surfaceless' || '' }}
          LIBGL_ALWAYS_SOFTWARE: ${{ contains(inputs.variant, 'opengl') && runner.os == 'Linux' && '1' || '' }}
          GALLIUM_DRIVER: ${{ contains(inputs.variant, 'opengl') && runner.os == 'Linux' && 'llvmpipe' || '' }}
        run: mise run test
      - run: mise run ci:prepare-native-artifact
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ inputs.variant }}
          path: ci-artifact
          if-no-files-found: error
          retention-days: 14

  bindings:
    name: bindings / ${{ matrix.binding }} / ${{ inputs.variant }}
    if: ${{ needs.prepare-matrices.outputs.bindings_count != '0' }}
    runs-on: ${{ inputs.runner }}
    needs:
      - prepare-matrices
      - native
    timeout-minutes: 60
    env:
      MISE_ENV: ${{ inputs.variant }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrices.outputs.bindings) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-ci-deps
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-${{ inputs.variant }}
          path: .
      - name: Install EGL/GLES2 runtime libraries (Linux OpenGL only)
        if: ${{ contains(inputs.variant, 'opengl') && runner.os == 'Linux' }}
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends libgles2 libegl-mesa0 libegl1 libgl1-mesa-dri
      - name: Run binding task
        env:
          # For OpenGL on Linux: direct EGL to the surfaceless platform and
          # force Mesa llvmpipe so tests can render without a display server.
          # These are no-ops for non-OpenGL backends (empty value is ignored).
          EGL_PLATFORM: ${{ contains(inputs.variant, 'opengl') && runner.os == 'Linux' && 'surfaceless' || '' }}
          LIBGL_ALWAYS_SOFTWARE: ${{ contains(inputs.variant, 'opengl') && runner.os == 'Linux' && '1' || '' }}
          GALLIUM_DRIVER: ${{ contains(inputs.variant, 'opengl') && runner.os == 'Linux' && 'llvmpipe' || '' }}
        run: mise run "${{ matrix.task }}"

  examples:
    name: examples / ${{ matrix.example }} / ${{ inputs.variant }}
    if: ${{ needs.prepare-matrices.outputs.examples_count != '0' }}
    runs-on: ${{ inputs.runner }}
    needs:
      - prepare-matrices
      - native
    timeout-minutes: 60
    env:
      MISE_ENV: ${{ inputs.variant }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrices.outputs.examples) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-ci-deps
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-${{ inputs.variant }}
          path: .
      - name: Install EGL/GLES2 dev+runtime libraries (Linux OpenGL only)
        if: ${{ contains(inputs.variant, 'opengl') && runner.os == 'Linux' }}
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends libegl-dev libgles2 libegl-mesa0 libegl1 libgl1-mesa-dri
      - name: Run example task
        env:
          # For OpenGL on Linux: direct EGL to the surfaceless platform and
          # force Mesa llvmpipe so examples can render without a display server.
          # These are no-ops for non-OpenGL backends (empty value is ignored).
          EGL_PLATFORM: ${{ contains(inputs.variant, 'opengl') && runner.os == 'Linux' && 'surfaceless' || '' }}
          LIBGL_ALWAYS_SOFTWARE: ${{ contains(inputs.variant, 'opengl') && runner.os == 'Linux' && '1' || '' }}
          GALLIUM_DRIVER: ${{ contains(inputs.variant, 'opengl') && runner.os == 'Linux' && 'llvmpipe' || '' }}
        run: mise run "${{ matrix.task }}"
